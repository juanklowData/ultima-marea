# Compila Última Marea para iPhone en un Mac de GitHub y deja un .ipa sin firmar para descargar.
# Se lanza a mano (pestaña Actions → "iOS para probar" → Run workflow) para no gastar minutos de Mac
# en cada cambio. El .ipa se instala desde Windows con Sideloadly, que lo firma con tu Apple ID.

name: iOS para probar

on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Las plantillas de Godot 4.7 enlazan con el SDK de iOS 26: hace falta Xcode 26 o más nuevo.
      - name: Elegir el Xcode más nuevo
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_[0-9]*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          mayor=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          if [ "$mayor" -lt 26 ]; then echo "::error::Hace falta Xcode 26 y el más nuevo es $xcode"; exit 1; fi

      # Godot y su plantilla de iOS pesan más de 1 GB; se guardan entre ejecuciones.
      - name: Caché de Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-ios

      - name: Descargar Godot y la plantilla de iOS
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/plantillas.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          destino="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$destino"
          unzip -q -j /tmp/plantillas.tpz templates/ios.zip templates/version.txt -d "$destino"
          rm /tmp/godot.zip /tmp/plantillas.tpz

      - name: Importar recursos
        run: ~/godot/Godot.app/Contents/MacOS/Godot --headless --path godot --import

      - name: Exportar el proyecto de Xcode
        run: |
          mkdir -p build
          ~/godot/Godot.app/Contents/MacOS/Godot --headless --path godot --export-release "iOS" "$GITHUB_WORKSPACE/build/UltimaMarea.ipa"
          test -d build/UltimaMarea.xcodeproj

      - name: Compilar sin firmar
        run: |
          xcodebuild -project build/UltimaMarea.xcodeproj -scheme UltimaMarea \
            -configuration Release -sdk iphoneos -destination "generic/platform=iOS" \
            -archivePath build/UltimaMarea.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""

      - name: Empaquetar el .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/UltimaMarea.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -qry UltimaMarea.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: UltimaMarea-iOS
          path: build/UltimaMarea.ipa
          retention-days: 14
